<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ふくい歯科クリニック受注・納品登録システム</title>
  <link rel="apple-touch-icon" id="app-icon">
  <script>
    setTimeout(function(){
      var c = document.createElement("canvas"); c.width = c.height = 512;
      var x = c.getContext("2d");
      var g = x.createLinearGradient(0, 0, 512, 512);
      g.addColorStop(0, "#43e97b"); g.addColorStop(1, "#0ba360");
      x.fillStyle = g; x.fillRect(0, 0, 512, 512);
      x.fillStyle = "#ffffff"; x.font = "900 185px sans-serif";
      x.textAlign = "center"; x.textBaseline = "middle";
      x.shadowColor = "rgba(0,70,30,0.35)"; x.shadowBlur = 18; x.shadowOffsetY = 8;
      x.fillText("291", 256, 268);
      document.getElementById("app-icon").href = c.toDataURL("image/png");
    }, 500);
  </script>
  <style>
    * { box-sizing: border-box; font-family: sans-serif; }
    body { margin: 0; padding: 14px; background: #e6f5ec; color: #2d4235; display: flex; justify-content: center; min-height: 100vh; touch-action: manipulation; }
    .screen { width: 100%; max-width: 1080px; background: #e6f5ec; border-radius: 24px; padding: 20px; box-shadow: 10px 10px 20px #c5dcd0, -10px -10px 20px #ffffff; display: flex; flex-direction: column; justify-content: space-between; min-height: calc(100vh - 28px); }
    .btn { background: #e6f5ec; border: none; border-radius: 12px; padding: 10px 16px; font-weight: bold; color: #2d4235; cursor: pointer; box-shadow: 3px 3px 6px #c5dcd0, -3px -3px 6px #ffffff; font-size: 13px; }
    .btn:active { box-shadow: inset 2px 2px 5px #c5dcd0, inset -2px -2px 5px #ffffff; }
    .btn-primary { background: #2f9e44; color: #fff; }
    .btn-sub { background: #3b82f6; color: #fff; padding: 6px 10px; font-size: 12px; }
    .btn-danger { background: #feb2b2; color: #4a3b3e; padding: 5px 10px; font-size: 12px; }
    select, input[type="text"], input[type="password"], input[type="number"] { width: 100%; padding: 11px; border: none; border-radius: 12px; background: #e6f5ec; box-shadow: inset 3px 3px 6px #c5dcd0, inset -3px -3px 6px #ffffff; font-size: 15px; color: #2d4235; }
    .login-center { max-width: 680px; width: 100%; margin: 0 auto auto; text-align: center; }
    .login-title { font-size: 26px; color: #2b8a3e; margin: 0 0 10px; }
    .clock { font-size: 19px; font-weight: bold; color: #22543d; max-width: 440px; margin: 0 auto 16px; padding: 10px; border-radius: 16px; box-shadow: inset 3px 3px 6px #c5dcd0, inset -3px -3px 6px #ffffff; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; padding-bottom: 10px; border-bottom: 2px solid #cde3d6; }
    .table-wrap { overflow-x: auto; flex: 1; }
    table { width: 100%; border-collapse: separate; border-spacing: 0 8px; min-width: 780px; }
    th { text-align: center; font-size: 13px; color: #22543d; padding: 6px; font-weight: bold; }
    td { background: #e6f5ec; padding: 10px 8px; text-align: center; font-size: 14px; font-weight: bold; box-shadow: 0 2px 5px #c5dcd0; }
    td:first-child { border-radius: 12px 0 0 12px; }
    td:last-child { border-radius: 0 12px 12px 0; }
    .footer-bar { display: flex; justify-content: space-between; align-items: flex-end; margin-top: 16px; padding-top: 8px; }
    .ver-text { font-size: 12px; color: #6b8776; font-weight: bold; }
    .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 100; }
    .modal-body { width: 100%; max-width: 460px; max-height: 90vh; overflow-y: auto; background: #e6f5ec; border-radius: 22px; padding: 20px; box-shadow: 8px 8px 16px #9bb8a8; }
    @keyframes pulseAlert { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.015); } }
    .consult-banner { background: #fff5f5; border: 2px solid #fc8181; border-radius: 16px; padding: 14px 16px; margin-bottom: 14px; box-shadow: 0 4px 12px rgba(229,62,62,0.18); animation: pulseAlert 2s infinite; }
  </style>
</head>
<body>
  <div class="screen" id="login-screen">
    <div style="display:flex; justify-content:flex-end; margin-bottom:4px;">
      <button type="button" class="btn" id="open-admin-auth-btn" style="font-size:12px;">⚙️ 管理画面</button>
    </div>
    <div class="login-center">
      <h1 class="login-title">🦷 ふくい歯科クリニック<br>受注・納品管理システム</h1>
      <div class="clock" id="clock">読み込み中...</div>
      <div style="max-width:440px; margin:0 auto;">
        <div style="text-align:left; font-size:13px; font-weight:bold; margin-bottom:4px;">業者名を選択してください</div>
        <select id="login-vendor" style="margin-bottom:12px;"><option value="">-- 業者名を選択 --</option></select>
        <div style="text-align:left; font-size:13px; font-weight:bold; margin-bottom:4px;">4桁パスワード</div>
        <input type="password" id="login-pass" maxlength="4" inputmode="numeric" placeholder="****" style="text-align:center; letter-spacing:8px; font-size:20px; margin-bottom:22px;">
      </div>
      <div style="text-align:left; font-size:26px; font-weight:bold; line-height:1.5; color:#2b8a3e;">
        <div style="text-align:center; margin-bottom:6px;">～入室方法～</div>
        <div>①業者名を選択</div>
        <div>②４桁PINを入力</div>
        <div>③右下部の【入室】ボタンをクリックしてください</div>
        <div style="padding-left:1em; text-indent:-1em; margin-top:4px;">※業者名の新規登録やPINを忘れた場合は<br>管理者までお知らせください</div>
      </div>
    </div>
    <div class="footer-bar">
      <span class="ver-text">Ver.1.1.6</span>
      <span class="ver-text" style="text-align:center;">© 2026 Fukui Dental Clinic. All Rights Reserved.</span>
      <button type="button" class="btn btn-primary" id="enter-btn" style="padding:14px 36px; font-size:17px;">入室 ➡</button>
    </div>
  </div>
  <div class="screen" id="main-screen" style="display:none;">
    <div style="display:flex; flex-direction:column; flex:1;">
      <div class="top-bar">
        <div style="display:flex; align-items:center; gap:10px;">
          <strong style="font-size:19px; color:#2b8a3e;">📦 注文・納品一覧</strong>
          <span id="vendor-badge" style="background:#b2f2bb; padding:4px 12px; border-radius:10px; font-size:13px; font-weight:bold;"></span>
        </div>
        <span style="font-size:12px; color:#496b57; font-weight:bold;">※単価を入力して全数または一部納品を押してください</span>
      </div>
      <div id="status" style="color:#e53e3e; font-size:12px; font-weight:bold; text-align:center;"></div>
      <div id="vendor-consult-box"></div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th style="width:32%; text-align:left; padding-left:14px;">品名</th>
              <th style="width:14%;">残注文数</th>
              <th style="width:16%;">単価(円)</th>
              <th style="width:16%;">全数納品</th>
              <th style="width:22%;">一部納品（数量指定）</th>
            </tr>
          </thead>
          <tbody id="order-tbody"></tbody>
        </table>
      </div>
    </div>
    <div class="footer-bar">
      <span class="ver-text">Ver.1.1.6</span>
      <button type="button" class="btn" id="exit-btn" style="padding:10px 28px; font-size:15px;">終了</button>
    </div>
  </div>
  <div class="modal" id="admin-auth-modal">
    <div class="modal-body" style="max-width:360px;">
      <h3 style="margin:0 0 14px; text-align:center; color:#2b8a3e;">管理者ログイン</h3>
      <label style="font-size:12px; font-weight:bold;">管理者ID</label>
      <input type="text" id="admin-id" placeholder="IDを入力" style="margin:6px 0 12px;">
      <label style="font-size:12px; font-weight:bold;">パスワード</label>
      <input type="password" id="admin-pw" placeholder="パスワードを入力" style="margin:6px 0 16px;">
      <div style="display:flex; gap:10px;">
        <button type="button" class="btn" id="auth-close" style="flex:1;">閉じる</button>
        <button type="button" class="btn btn-primary" id="auth-ok" style="flex:1;">認証</button>
      </div>
    </div>
  </div>

  <div class="modal" id="admin-modal">
    <div class="modal-body">
      <h3 style="margin:0 0 14px; text-align:center; color:#2b8a3e;">業者名・4桁パスワード管理</h3>
      <label style="font-size:12px; font-weight:bold;">新しい業者を追加</label>
      <div style="display:flex; gap:6px; margin:6px 0 16px;">
        <input type="text" id="adm-new-v" placeholder="業者名" style="flex:2;">
        <input type="text" id="adm-new-p" maxlength="4" placeholder="4桁PASS" style="flex:1; text-align:center;">
        <button type="button" class="btn btn-primary" id="adm-add-btn" style="white-space:nowrap;">追加</button>
      </div>
      <label style="font-size:12px; font-weight:bold;">登録済み業者（4桁パスワード変更・削除）</label>
      <div id="adm-vendor-list" style="margin:8px 0 16px;"></div>
      <button type="button" class="btn" id="admin-close" style="width:100%;">閉じる</button>
    </div>
  </div>

  <script>
    var SB_URL = "https://" + "krwddlhwqkgggyxdcncn" + ".supabase.co/rest/v1";
    var SB_KEY = "sb_publishable_nfJsyzjRbQ8jeIHgVHwoqg_-B1glb0G";
    var currentVendor = "", vendors = [], items = [], consults = [];
    function updateClock() {
      var now = new Date();
      var w = ["日","月","火","水","木","金","土"][now.getDay()];
      document.getElementById("clock").innerText = now.getFullYear() + "年" + (now.getMonth()+1) + "月" + now.getDate() + "日(" + w + ") " +
        String(now.getHours()).padStart(2,"0") + ":" + String(now.getMinutes()).padStart(2,"0") + ":" + String(now.getSeconds()).padStart(2,"0");
    }
    updateClock(); setInterval(updateClock, 1000);
    function api(path, opt) {
      opt = opt || {};
      var h = { "apikey": SB_KEY, "Authorization": "Bearer " + SB_KEY, "Content-Type": "application/json" };
      if (opt.headers) { for (var k in opt.headers) h[k] = opt.headers[k]; }
      opt.headers = h;
      return fetch(SB_URL + path, opt);
    }
    function renderOrders() {
      var myConsults = consults.filter(function(c){ return c.vendor === currentVendor; });
      document.getElementById("vendor-consult-box").innerHTML = myConsults.map(function(c){
        return '<div class="consult-banner">' +
          '<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;">' +
          '<div style="color:#c53030;font-weight:bold;font-size:16px;">🔔 スタッフより連絡（来院時にお声がけください）</div>' +
          '<button type="button" class="btn btn-primary" style="background:#e53e3e;padding:6px 14px;" onclick="doneConsult(' + c.id + ')">✔ 対応完了（消去）</button>' +
          '</div>' +
          '<div style="margin-top:8px;font-size:15px;font-weight:bold;color:#2d3748;">' +
          '【種別】<span style="background:#fed7d7;color:#9b2c2c;padding:2px 8px;border-radius:6px;">' + c.category + '</span>　' +
          '【依頼スタッフ】' + c.staff_name +
          (c.detail ? '<div style="margin-top:6px;padding:8px 12px;background:#fff;border-radius:10px;font-size:14px;">内容：' + c.detail.replace(/</g,"&lt;") + '</div>' : '') +
          '</div></div>';
      }).join("");

      var myOrders = items.filter(function(it){ return it.vendor === currentVendor && Number(it.ordered_qty || 0) > 0; });
      var tbody = document.getElementById("order-tbody");
      if (myOrders.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" style="border-radius:12px; color:#6b8776; padding:24px;">現在、注文中の品目はありません</td></tr>';
        return;
      }
      tbody.innerHTML = myOrders.map(function(it) {
        var unitStr = it.unit || "個";
        var oq = Number(it.ordered_qty);
        var opts = "";
        for (var n = 1; n < oq; n++) opts += '<option value="' + n + '">' + n + unitStr + '</option>';
        var partHtml = oq > 1
          ? '<div style="display:inline-flex; gap:6px; align-items:center;"><select id="part-' + it.id + '" style="width:auto; padding:5px 8px; font-size:13px;">' + opts + '</select><button type="button" class="btn btn-sub" onclick="deliverPart(' + it.id + ')">一部納品</button></div>'
          : '<span style="color:#a0aec0; font-size:12px;">-</span>';
        return '<tr>' +
          '<td style="text-align:left; padding-left:14px;">' + it.item_name.replace(/</g,"&lt;") + '</td>' +
          '<td style="font-size:17px; color:#c53030;">' + oq + unitStr + '</td>' +
          '<td><input type="text" inputmode="numeric" pattern="[0-9]*" id="price-' + it.id + '" value="' + (it.unit_price || '') + '" placeholder="単価" oninput="this.value=this.value.replace(/[^0-9]/g,\'\')" style="width:100px; padding:6px; text-align:right; font-size:15px;"></td>' +
          '<td><button type="button" class="btn btn-primary" style="padding:7px 14px;" onclick="deliverAll(' + it.id + ')">✔ 全数納品</button></td>' +
          '<td>' + partHtml + '</td>' +
        '</tr>';
      }).join("");
    }
    async function loadAll() {
      try {
        var r0 = await api("/vendors?select=*&order=name.asc");
        if (r0.ok) {
          vendors = await r0.json();
          var sel = document.getElementById("login-vendor"), old = sel.value;
          sel.innerHTML = '<option value="">-- 業者名を選択 --</option>' + vendors.map(function(v){ return '<option value="' + v.name + '">' + v.name + '</option>'; }).join("");
          if (vendors.some(function(v){ return v.name === old; })) sel.value = old;

          document.getElementById("adm-vendor-list").innerHTML = vendors.length ? vendors.map(function(v){
            return '<div style="display:flex; gap:6px; align-items:center; margin-bottom:8px; padding:8px; border-radius:12px; box-shadow:inset 2px 2px 5px #c5dcd0;">' +
              '<span style="flex:2; font-weight:bold;">' + v.name + '</span>' +
              '<input type="text" id="vp-' + v.name + '" value="' + (v.passcode || '') + '" maxlength="4" placeholder="4桁" style="flex:1; padding:6px; text-align:center;">' +
              '<button type="button" class="btn btn-primary" style="padding:6px 10px; font-size:12px;" onclick="saveVendorPass(\'' + v.name + '\')">保存</button>' +
              '<button type="button" class="btn btn-danger" onclick="delVendor(\'' + v.name + '\')">削除</button></div>';
          }).join("") : '<p style="font-size:13px; color:#6b8776; text-align:center;">登録されている業者はいません</p>';
        }
        var r1 = await api("/inventory?select=*&order=id.asc");
        if (!r1.ok) throw new Error(await r1.text());
        items = await r1.json();
              var r2 = await api("/consultations?select=*&order=id.asc");
      if (r2.ok) consults = await r2.json();
      var act = document.activeElement;
      var isEditing = act && act.id && (act.id.indexOf("price-") === 0 || act.id.indexOf("part-") === 0);
      if (currentVendor && !isEditing) renderOrders();
      document.getElementById("status").innerText = "";

      } catch (e) { document.getElementById("status").innerText = "エラー: " + e.message; }
    }
    loadAll(); setInterval(loadAll, 5000);
    async function doneConsult(id) { if (confirm("スタッフへの対応が完了しましたか？（この通知を消去します）")) { await api("/consultations?id=eq." + id, { method: "DELETE" }); await loadAll(); } }
    async function deliverAll(id) {
      var it = items.find(function(x){ return x.id === id; }); if (!it) return;
      var price = Number(document.getElementById("price-" + id).value);
      if (!price || price <= 0) return alert("単価（円）を入力してください");
      var oq = Number(it.ordered_qty), td = Number(it.today_delivery || 0);
      await api("/inventory?id=eq." + id, { method: "PATCH", body: JSON.stringify({ ordered_qty: 0, today_delivery: td + oq, unit_price: price, delivery_checked: false }) });
      alert(it.item_name + " を全数納品（" + oq + (it.unit||"個") + "）として送信しました！"); await loadAll();
    }
    async function deliverPart(id) {
      var it = items.find(function(x){ return x.id === id; }); if (!it) return;
      var price = Number(document.getElementById("price-" + id).value);
      if (!price || price <= 0) return alert("単価（円）を入力してください");
      var partQty = Number(document.getElementById("part-" + id).value);
      var remain = Number(it.ordered_qty) - partQty, td = Number(it.today_delivery || 0);
      await api("/inventory?id=eq." + id, { method: "PATCH", body: JSON.stringify({ ordered_qty: remain, today_delivery: td + partQty, unit_price: price, delivery_checked: false }) });
      alert(it.item_name + " を一部納品（" + partQty + (it.unit||"個") + "）しました。残注文数は " + remain + (it.unit||"個") + " です。"); await loadAll();
    }
    document.getElementById("enter-btn").onclick = function() {
      var vName = document.getElementById("login-vendor").value, pw = document.getElementById("login-pass").value.trim();
      if (!vName) return alert("業者名を選択してください");
      var vObj = vendors.find(function(v){ return v.name === vName; });
      if (!vObj || !vObj.passcode) return alert("この業者はまだパスワードが設定されていません。管理画面から設定してください。");
      if (vObj.passcode !== pw) return alert("4桁パスワードが正しくありません");
      currentVendor = vName; document.getElementById("vendor-badge").innerText = "業者: " + currentVendor;
      document.getElementById("login-screen").style.display = "none"; document.getElementById("main-screen").style.display = "flex"; renderOrders();
    };
    document.getElementById("exit-btn").onclick = function() { currentVendor = ""; document.getElementById("login-pass").value = ""; document.getElementById("main-screen").style.display = "none"; document.getElementById("login-screen").style.display = "flex"; };
    document.getElementById("open-admin-auth-btn").onclick = function() { document.getElementById("admin-auth-modal").style.display = "flex"; };
    document.getElementById("auth-close").onclick = function() { document.getElementById("admin-auth-modal").style.display = "none"; };
    document.getElementById("auth-ok").onclick = function() {
      var id = document.getElementById("admin-id").value.trim(), pw = document.getElementById("admin-pw").value.trim();
      if (id === "291DC" && pw === "asdf654zxcv321") { document.getElementById("admin-id").value = ""; document.getElementById("admin-pw").value = ""; document.getElementById("admin-auth-modal").style.display = "none"; document.getElementById("admin-modal").style.display = "flex"; }
      else { alert("IDまたはパスワードが違います"); }
    };
    document.getElementById("admin-close").onclick = function() { document.getElementById("admin-modal").style.display = "none"; };
    document.getElementById("adm-add-btn").onclick = async function() {
      var n = document.getElementById("adm-new-v").value.trim(), p = document.getElementById("adm-new-p").value.trim();
      if (!n) return alert("業者名を入力してください");
      if (p && p.length !== 4) return alert("パスワードは4桁の数字で入力してください");
      var res = await api("/vendors", { method: "POST", body: JSON.stringify({ name: n, passcode: p }) });
      if (!res.ok) return alert("登録エラー: " + await res.text());
      document.getElementById("adm-new-v").value = ""; document.getElementById("adm-new-p").value = ""; await loadAll();
    };
    async function saveVendorPass(vName) {
      var p = document.getElementById("vp-" + vName).value.trim();
      if (p.length !== 4) return alert("4桁のパスワードを入力してください");
      await api("/vendors?name=eq." + encodeURIComponent(vName), { method: "PATCH", body: JSON.stringify({ passcode: p }) });
      alert(vName + " のパスワードを保存しました"); await loadAll();
    }
    async function delVendor(vName) { if (confirm(vName + " を削除しますか？")) { await api("/vendors?name=eq." + encodeURIComponent(vName), { method: "DELETE" }); await loadAll(); } }
  </script>
</body>
</html>
